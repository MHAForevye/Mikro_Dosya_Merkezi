<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>Mikro Dosya Merkezi</title>
<link rel="manifest" href="manifest.webmanifest">
<script>
/* Tema, sayfa çizilmeden önce uygulanır (beyaz parlama olmasın) */
(function(){var m='system';try{m=localStorage.getItem('mdm-theme')||'system'}catch(e){}
var d=m==='dark'||(m==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.dataset.theme=d?'dark':'light'})();
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="shell">
<aside class="side" id="sidebar">
  <div class="brand"><div class="logo">▣</div><div><strong>Mikro Dosya Merkezi</strong><small>Dosyaların için çalışma alanı</small></div></div>
  <nav class="nav" id="nav">
    <button data-page="home">⌂　Ana Sayfa</button><button data-page="open">＋　Dosyalar</button>
    <div class="group">Düzenleyiciler</div>
    <button data-page="pdf">▤　PDF Düzenleyici</button><button data-page="word">▧　Word (DOCX)</button><button data-page="table">▦　Tablo (CSV/XLSX)</button><button data-page="slides">▣　Sunum (PPTX)</button><button data-page="text">⌘　Metin ve Kod</button><button data-page="image">◩　Görsel</button><button data-page="archive">▥　ZIP Arşivi</button>
    <div class="group">Uygulama</div>
    <button data-page="settings">⚙　Ayarlar</button><button data-page="help">ⓘ　Yardım</button>
  </nav>
  <div class="privacy">🔒 Dosyalar tarayıcında işlenir; dosya yükleme sunucusu yoktur. Harici motorlar ağdan indirilebilir.</div>
</aside>
<div class="backdrop" id="backdrop"></div>
<main class="main">
  <div class="top">
    <div class="titlebox"><button class="mobilemenu" id="menu" aria-label="Menü">☰</button><div><h1 id="pagetitle"></h1><div class="sub" id="pagesub"></div></div></div>
    <div class="topactions"><button id="themebtn" aria-label="Temayı değiştir"></button><button id="quickopen" class="primary">Dosya seç</button></div>
  </div>
  <div id="view"></div>
  <div class="footer">Mikro Dosya Merkezi • Yerel çalışma öncelikli • GitHub Pages uyumlu</div>
</main>
</div>
<input type="file" id="fileinput" multiple class="hidden">
<div id="toast" class="toast hidden" role="status"></div>
<script src="js/core.js"></script>
<script src="js/pdf-editor.js"></script>
<script src="js/office.js"></script>
<script src="js/editors.js"></script>
<script>App.start()</script>
</body>
</html>
